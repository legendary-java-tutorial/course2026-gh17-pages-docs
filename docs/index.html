<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Угадай число</title>
</head>
<body>
  <h1>Угадай число</h1>
  <p id="greeting">Режимы: classic, quick</p>
  <p id="theme"></p>
  <button data-mode="quick">quick</button>
  <button data-mode="classic">classic</button>
  <input id="guess" type="number">
  <button id="check">Проверить</button>
  <p id="answer"></p>
  <script>
    fetch('game.json').then(r => r.json()).then(game => {
      document.getElementById('theme').textContent = 'тема: ' + game.theme;
      let mode = game.modes.classic;
      let secret = 0;
      const start = name => {
        mode = game.modes[name];
        secret = mode.min + Math.floor(Math.random() * (mode.max - mode.min + 1));
        document.getElementById('answer').textContent = game.greeting;
      };
      document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => start(b.dataset.mode));
      document.getElementById('check').onclick = () => {
        const n = Number(document.getElementById('guess').value);
        const text = n === secret ? mode.win : (n < secret ? mode.higher : mode.lower);
        document.getElementById('answer').textContent = text;
      };
      start('classic');
    });
  </script>
</body>
</html>
